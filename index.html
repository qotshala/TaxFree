<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD POINT - TAX FREE</title>
    <style>
        body { background-color: #000; color: #D4AF37; font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 400px; background: #111; padding: 25px; border-radius: 20px; border: 1px solid #D4AF37; box-sizing: border-box; }
        h1 { font-size: 14px; text-align: center; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 25px; }
        input { width: 100%; background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 15px; color: #fff; font-size: 28px; text-align: center; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        button { width: 100%; background: #D4AF37; color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #res-box { margin-top: 25px; display: none; background: #1a1a1a; padding: 15px; border-radius: 12px; border-left: 4px solid #D4AF37; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .row:last-child { border-bottom: none; }
        .lab { color: #888; font-size: 12px; text-transform: uppercase; }
        .val { color: #fff; font-weight: bold; font-size: 20px; }
        .fasha { color: #D4AF37; font-size: 12px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gold Point System</h1>
    <input type="number" id="netoIn" placeholder="Shuma NETO" inputmode="decimal">
    <button onclick="calculate()">Llogarit Saktë</button>

    <div id="res-box">
        <div class="row">
            <span class="lab">Në PC (Bruto):</span>
            <span class="val" id="brutoOut"></span>
        </div>
        <div class="row">
            <span class="lab">Tax (Rimbursimi):</span>
            <span class="val" id="taxOut"></span>
        </div>
        <div style="margin-top:10px;">
            <span class="lab">Fasha Zyrtare:</span><br>
            <span class="fasha" id="fashaOut"></span>
        </div>
    </div>
</div>

<script>
// Te dhenat nga PDF-i i PTF Czech Republic s.r.o.
const tiers = [
    {min: 2001, max: 2249, r: 270}, {min: 2250, max: 2499, r: 285},
    {min: 2500, max: 2749, r: 310}, {min: 2750, max: 2999, r: 340},
    {min: 3000, max: 3249, r: 370}, {min: 3250, max: 3499, r: 400},
    {min: 3500, max: 3749, r: 430}, {min: 3750, max: 3999, r: 450},
    {min: 4000, max: 4249, r: 490}, {min: 4250, max: 4499, r: 510},
    {min: 4500, max: 4749, r: 540}, {min: 4750, max: 4999, r: 570},
    {min: 5000, max: 5249, r: 600}, {min: 5250, max: 5499, r: 630},
    {min: 5500, max: 5749, r: 660}, {min: 5750, max: 5999, r: 690},
    {min: 37000, max: 37999, r: 4700}, {min: 38000, max: 38999, r: 4830},
    {min: 39000, max: 39999, r: 4970}, {min: 40000, max: 40999, r: 5110},
    {min: 41000, max: 41999, r: 5260}, {min: 42000, max: 42999, r: 5400},
    {min: 43000, max: 43999, r: 5540}, {min: 44000, max: 44999, r: 5680},
    {min: 45000, max: 45999, r: 5820}, {min: 46000, max: 46999, r: 5970},
    {min: 47000, max: 47999, r: 6110}, {min: 48000, max: 48999, r: 6260},
    {min: 99000, max: 99999, r: 14530}
];

function calculate() {
    const neto = parseFloat(document.getElementById('netoIn').value);
    if (!neto) return;

    let result = null;

    // Kerkojme ne te gjitha fashat nga lart-poshte per te gjetur perputhjen sakt
    for (let i = tiers.length - 1; i >= 0; i--) {
        let t = tiers[i];
        let calculatedBruto = neto + t.r;

        // Kontrollon nese Bruto e llogaritur bie brenda kesaj fashe
        if (calculatedBruto >= t.min && calculatedBruto <= t.max) {
            result = { bruto: calculatedBruto, tax: t.r, label: t.min + " - " + t.max + " CZK" };
            break; 
        }
    }

    // Per raste mbi 100,000 sipas rregullit 15% ne PDF
    if (!result && neto > 85000) {
        let b = Math.ceil(neto / 0.85);
        result = { bruto: b, tax: b - neto, label: "Mbi 100,000 (15%)" };
    }

    if (result) {
        document.getElementById('brutoOut').innerText = Math.floor(result.bruto).toLocaleString();
        document.getElementById('taxOut').innerText = result.tax.toLocaleString();
        document.getElementById('fashaOut').innerText = result.label;
        document.getElementById('res-box').style.display = "block";
    }
    document.activeElement.blur();
}
</script>

</body>
</html>
